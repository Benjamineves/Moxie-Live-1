<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Moxie — No connection</title>
<style>
  :root{
    --navy:#0d1f35; --gold:#c9a84c; --cream:#f5f2ec; --text2:#3a5068;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; padding:32px;
    background:var(--cream); color:var(--navy);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  .mark{ width:56px; height:56px; }
  h1{
    font-family:Georgia,'Times New Roman',serif; font-weight:300; font-style:italic;
    font-size:26px; margin:4px 0 0;
  }
  h1 em{ font-style:italic; color:var(--gold); }
  p{ max-width:320px; font-size:14px; color:var(--text2); line-height:1.6; margin:0; }
  button{
    margin-top:10px; border:none; border-radius:10px; padding:12px 22px;
    background:var(--navy); color:var(--gold); font-size:13px; font-weight:600;
    letter-spacing:.04em; text-transform:uppercase; cursor:pointer;
  }
  a.saved{
    display:block; margin-top:8px; padding:12px 18px; border-radius:10px;
    border:1px solid rgba(201,168,76,.4); text-decoration:none;
    color:var(--navy); font-size:14px; font-weight:500;
  }
  #saved-list{ width:100%; max-width:320px; }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect x="22" y="21" width="10" height="10" fill="#0d1f35"/>
    <rect x="22" y="33" width="10" height="10" fill="#0d1f35"/>
    <rect x="22" y="45" width="10" height="10" fill="#0d1f35"/>
    <rect x="22" y="57" width="10" height="10" fill="#0d1f35"/>
    <rect x="22" y="69" width="10" height="10" fill="#0d1f35"/>
    <rect x="68" y="21" width="10" height="10" fill="#0d1f35"/>
    <rect x="68" y="33" width="10" height="10" fill="#0d1f35"/>
    <rect x="68" y="45" width="10" height="10" fill="#0d1f35"/>
    <rect x="68" y="57" width="10" height="10" fill="#0d1f35"/>
    <rect x="68" y="69" width="10" height="10" fill="#0d1f35"/>
    <rect x="34" y="33" width="10" height="10" fill="#0d1f35"/>
    <rect x="56" y="33" width="10" height="10" fill="#0d1f35"/>
    <rect x="45" y="45" width="10" height="10" fill="#0d1f35"/>
    <rect x="14" y="14" width="10" height="2.5" fill="#c9a84c"/>
    <rect x="14" y="14" width="2.5" height="10" fill="#c9a84c"/>
    <rect x="76" y="14" width="10" height="2.5" fill="#c9a84c"/>
    <rect x="83.5" y="14" width="2.5" height="10" fill="#c9a84c"/>
    <rect x="14" y="83.5" width="10" height="2.5" fill="#c9a84c"/>
    <rect x="14" y="76" width="2.5" height="10" fill="#c9a84c"/>
    <rect x="76" y="83.5" width="10" height="2.5" fill="#c9a84c"/>
    <rect x="83.5" y="76" width="2.5" height="10" fill="#c9a84c"/>
    <rect x="83.5" y="83.5" width="4" height="4" fill="#17c3b2"/>
  </svg>
  <h1>No <em>connection.</em></h1>
  <p id="main-copy">Moxie needs a signal to load your account. Reconnect and try again — or open a vessel you've already saved for offline below.</p>
  <div id="saved-list"></div>
  <button onclick="location.reload()">Try again</button>
  <script>
    // Plain script, no framework — this file is served as a static
    // asset, not a Next page, so it has no bundler access. Reads the
    // same localStorage key offline-vessel-store.ts writes
    // (moxie-offline-vessels) directly; same origin, so it's readable
    // here regardless of which page wrote it.
    try {
      var raw = window.localStorage.getItem("moxie-offline-vessels");
      var vessels = raw ? Object.values(JSON.parse(raw)) : [];
      var list = document.getElementById("saved-list");
      if (vessels.length === 0) {
        document.getElementById("main-copy").textContent =
          "Moxie needs a signal to load your account. Nothing has been saved for offline access on this device yet.";
      } else {
        vessels.sort(function (a, b) { return (b.lastSyncedAt || "").localeCompare(a.lastSyncedAt || ""); });
        vessels.forEach(function (v) {
          var a = document.createElement("a");
          a.className = "saved";
          a.href = "/offline-vessel?mxeId=" + encodeURIComponent(v.mxeId);
          a.textContent = (v.vesselName || v.mxeId) + " — view offline copy";
          list.appendChild(a);
        });
      }
    } catch (e) {
      // localStorage unavailable (private browsing) — the generic
      // "reconnect" copy above already covers this case.
    }
  </script>
</body>
</html>
